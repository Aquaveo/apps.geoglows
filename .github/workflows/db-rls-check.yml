name: DB RLS check

# Fails the PR if any regular table in `core` or `public` is missing
# `relrowsecurity = true` after migrations apply against a fresh local
# Supabase stack.
#
# Plan: docs/plans/2026-04-29-005-feat-profiles-relocation-to-core-schema-plan.md
# (Unit 2 — RLS-enabled CI guardrail)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/check-rls-enabled.sql"
      - ".github/workflows/db-rls-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/check-rls-enabled.sql"
      - ".github/workflows/db-rls-check.yml"
  workflow_dispatch:

concurrency:
  group: db-rls-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack and apply migrations
        run: supabase db start
        # `supabase db start` boots only the database container (lighter than
        # `supabase start`, which boots the whole stack including studio /
        # realtime / storage / etc.) and applies all migrations from
        # supabase/migrations/. Sufficient for a pg_class introspection check.

      - name: Run RLS-enabled check
        run: |
          DB_URL=$(supabase status -o env | awk -F= '/^DB_URL=/{gsub(/"/,"",$2); print $2}')
          if [ -z "$DB_URL" ]; then
            echo "::error::Could not extract DB_URL from supabase status"
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/check-rls-enabled.sql

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
