<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Water Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<dialog id="geoglows-disclaimer-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0 rounded-2xl p-0 max-w-2xl w-[calc(100vw-2rem)] max-h-[90vh] overflow-hidden backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl"></dialog>
<script>
  // Capture window.location synchronously BEFORE the module bundle is
  // fetched so the password-recovery snapshot in src/main.js can read
  // the original hash even after Supabase JS has consumed and cleared
  // it. Bundler module-evaluation ordering doesn't always match source-
  // level import order — see aquiferx 2026-05-01 race fix.
  window.__GEOGLOWS_INITIAL_URL__ = {
    hash: window.location.hash,
    search: window.location.search,
  };
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
